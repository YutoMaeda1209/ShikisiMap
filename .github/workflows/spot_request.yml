name: Spot Request Automation

on:
  issue_comment:
    types: [created]

permissions:
  # OIDC token that authenticates the workflow to the admin API.
  id-token: write
  issues: write

jobs:
  process-spot-request:
    # Only a maintainer's "/approve" comment on a spot request issue registers the spot.
    # The script checks the exact form of the comment.
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'new spot') &&
      startsWith(github.event.comment.body, '/approve') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-26.04
    concurrency:
      group: spot-request-${{ github.event.issue.number }}
    steps:
      # issue_comment runs on the default branch, which is the only ref the admin API accepts.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Process spot request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          SPOT_API_URL: ${{ vars.SPOT_API_URL || 'https://map.mendako.dev/api/admin/spots' }}
          # Must match ADMIN_OIDC_AUDIENCE of the backend.
          SPOT_API_AUDIENCE: ${{ vars.SPOT_API_AUDIENCE || 'https://map.mendako.dev/api/admin' }}
        run: node .github/scripts/process-spot-request.ts
