name: ShikisiMap Build and Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # OIDC token for the Tailscale federated identity.
  id-token: write

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-26.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install Dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Build Project
        working-directory: src/frontend
        run: npm run build
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:deploy-shikisimap
          ping: shikisimap.taile65cb9.ts.net
      # Tailscale SSH authenticates the runner by its tailnet identity, so no SSH key is needed.
      - name: Deploy to Server
        run: >-
          rsync -rlcvz --delete --chmod=D755,F644
          -e "ssh -o StrictHostKeyChecking=accept-new"
          src/frontend/dist/ deploy@shikisimap.taile65cb9.ts.net:/srv/www/
