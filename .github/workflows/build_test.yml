name: Build Test
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: src/backend
    services:
      db:
        # Same image as the dev container (.devcontainer/docker-compose.yml).
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_USER: shikisimap
          POSTGRES_PASSWORD: shikisimap
          POSTGRES_DB: shikisimap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shikisimap -d shikisimap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://shikisimap:shikisimap@localhost:5432/shikisimap?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
